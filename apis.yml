name: Pedestal Health (formerly Target RWE)
description: 'Pedestal Health, formerly Target RWE (and NoviSci), is a Durham, North Carolina real-world
  evidence and health-data company serving life sciences organizations and health systems. It generates
  regulatory-grade real-world evidence from large-scale observational data and longitudinal patient cohorts
  across hepatology, dermatology, and gastroenterology (including the TARGET-NASH, TARGET-Derm, and
  TARGET-Gastro registries), supporting clinical development, regulatory strategy, and care delivery.
  The company operates as a data, research, and services provider and does not publish a public developer
  API, SDK, or documentation surface. This profile was surfaced as a portfolio company of Norwest Venture
  Partners and enriched from the company''s public website (targetrwe.com now redirects to
  pedestalhealth.com).'
